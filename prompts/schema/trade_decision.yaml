name: schema/trade_decision
description: TradeDecision field descriptions used by response_format schema.
fields:
  should_trade: "Only true when edge_market is positive, source-backed, pricing-in explanation is credible, evidence_basis is not absence_only, edge_source is not none, and primary_source_url is populated for non-sports markets. Fallback/no-external-odds trades require the configured fallback edge threshold. Do not trade on edge_external alone."
  outcome: "The outcome you predict will win"
  confidence: "Your probability estimate (0.0-1.0). Cap non-definitive confidence at 0.89 and keep confidence <= evidence_quality + 0.05; confidence >0.89 requires direct definitive evidence with primary_source_url."
  probability_yes: "Optional canonical YES probability (0.0-1.0), even when outcome is NO. Used for self-consistency averaging and should reflect the final revised probability after counter-evidence."
  bet_size_pct: "Fraction of max bet (0.0-1.0). Scale with edge size, not just confidence."
  reasoning: "MUST include: 1) Implied prob from odds, 2) Your prob estimate, 3) Calculated edge_market (your prob - market implied prob), 4) Why the edge exists and has not been priced in, 5) 2-3 key sources with dates, 6) base rate considered, and 7) uncertainty factors in <=40 words. For no-action, keep it concise and name the missing evidence to research later."
  key_sources: "Optional list of 2-3 decisive primary or high-quality sources with source name and date."
  base_rate_used: "Optional boolean indicating whether a relevant 2024-2026 or market-specific base rate was explicitly considered."
  uncertainty_note: "Optional concise uncertainty factors string, maximum 40 words."
  self_critique: "Optional self-critique describing counter-evidence or base-rate considerations that could lower the probability by 8-15%."
  implied_prob_external: "Optional externally sourced implied probability from books/polls/markets."
  my_prob: "Optional explicit analyst probability estimate."
  edge_external: "Optional explicit edge from external implied probability (my_prob - implied_prob_external)."
  edge_source: "Source of edge calculation (computed, fallback, or none). edge_source=none means the analysis found a research gap, not a market judgment. Use fallback only when no external implied probability is available; fallback requires the configured fallback edge threshold and cannot justify should_trade=true from edge_external alone."
  evidence_basis: "Evidence basis class (direct, proxy, or absence_only). Direct requires a cited source that explicitly matches the market's settlement criteria; for non-sports markets it also requires primary_source_url. Previews, vague forecasts, missing source URLs, and silence are proxy or absence_only. absence_only means abstain and describe what to research next."
  primary_source_url: "URL of the single most decisive primary source used. REQUIRED when should_trade=true for any non-sports market; missing URL will cause rejection. For live-price markets use exchange or Tier-1 wire-service quote pages, for weather use NWS/NOAA pages, and for speech/mention use transcripts or official statements."
  likelihood_ratio: "Optional likelihood ratio P(evidence|predicted_outcome) / P(evidence|alternative_outcome). Use null when no likelihood evidence is available — never use 0 (undefined). Use 1.0 when evidence is equally consistent with both outcomes. Values above 1.0 favor the predicted outcome; below 1.0 favor the alternative."
  evidence_quality: "Evidence quality score (0-1), set by validation layer. evidence_quality=0.0 means missing usable evidence and must be treated as a research gap. When evidence_basis=proxy, evidence_quality must not exceed 0.75 — having a primary_source_url does not override this ceiling — except for sports markets backed by external bookmaker/sportsbook odds, where settlement-predictive odds may reach 0.80. eq above the applicable proxy ceiling is reserved exclusively for evidence_basis=direct."
  abstain: "True when evidence quality is too weak to act on this cycle."
  raw_should_trade: "Raw model value before validation and enforcement."
  raw_outcome: "Raw model outcome before canonical normalization."
  raw_confidence: "Raw model confidence before normalization and capping."
  raw_bet_size_pct: "Raw model bet size before validation and policy gates."
  raw_reasoning: "Raw model reasoning before validator annotations."
  raw_evidence_quality: "Raw model evidence quality before validation recalibration."
  definitive_outcome_detected: "True when definitive settlement-aligned evidence is detected."
  evidence_quality_floor_applied: "Name of the evidence-quality floor rule applied during validation."
  source_match_class: "Validator-assigned class for the strongest evidence source: settlement_aligned, preview_or_proxy, verifiable_unmatched, missing_or_absence_only, or unverified."
  evidence_floor_suppressed_reason: "Validator-assigned reason an evidence-quality floor was not applied despite a verifiable-looking source signal."
  prompt_tokens: "Prompt token usage captured from provider response."
  completion_tokens: "Completion token usage captured from provider response."
  reasoning_tokens: "Reasoning token usage captured from provider response."
  cached_tokens: "Cached prompt token usage captured from provider response."
