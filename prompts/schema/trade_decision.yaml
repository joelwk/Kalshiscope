name: schema/trade_decision
description: TradeDecision field descriptions used by response_format schema.
fields:
  should_trade: "Only true when chosen-side edge_market is positive after self-critique (edge_market must match confidence vs Kalshi, not a separate optimistic my_prob), edge_mechanism is not none, source-backed, pricing-in explanation is credible, evidence_basis is not absence_only, edge_source is not none, and primary_source_url is populated for non-sports markets (sports may cite an odds https URL in key_sources). A directional hunch is never enough. Fallback/no-external-odds trades require the configured fallback edge threshold. Do not trade on edge_external alone. Never true when the chosen side has non-positive edge_market."
  outcome: "The outcome you predict will win. Must be the side with positive edge_market versus Kalshi (if my_prob < YES market price, choose NO; if my_prob > YES market price, choose YES)."
  confidence: "Your probability estimate for the chosen outcome (0.0-1.0) AFTER self-critique. This is the value gates use with Kalshi prices. Cap non-definitive confidence at 0.89 and keep confidence <= evidence_quality + 0.05; confidence >0.89 requires direct definitive evidence with primary_source_url. Do not report a high my_prob while keeping a low confidence that would erase the claimed edge."
  probability_yes: "Optional canonical YES probability (0.0-1.0), even when outcome is NO. Used for self-consistency averaging and should reflect the final revised probability after counter-evidence. Must agree with my_prob."
  bet_size_pct: "Fraction of max bet (0.0-1.0). Scale with edge size, not just confidence."
  reasoning: "MUST include: 1) Implied prob from Kalshi, 2) Your final my_prob / confidence, 3) Calculated chosen-side edge_market vs Kalshi (not a parallel optimistic edge), 4) Why the edge exists and has not been priced in, 5) 2-3 key sources with dates, 6) base rate considered, and 7) uncertainty factors in <=40 words. For no-action, keep it concise and name the missing evidence to research later."
  key_sources: "Optional list of 2-3 decisive primary or high-quality sources. Prefer including the https:// URL alongside the source name and date when a URL exists; do not substitute a prose page label for a missing primary_source_url."
  base_rate_used: "Optional boolean indicating whether a relevant 2024-2026 or market-specific base rate was explicitly considered."
  uncertainty_note: "Optional concise uncertainty factors string, maximum 40 words."
  self_critique: "Optional self-critique describing counter-evidence or base-rate considerations that could lower the probability by 8-15%."
  implied_prob_external: "Optional externally sourced YES-side implied probability from books/polls/official feeds/indexes/NWS PoP (P(YES)), never the Kalshi yes_price and never the chosen-outcome price alone. NWS PoP for rain markets is a valid implied_prob_external. If the only price you have is Kalshi, leave this null."
  my_prob: "Optional explicit analyst P(YES) in 0.0-1.0 AFTER self-critique. Always store the YES probability, even when outcome is NO (then my_prob should be < 0.5). Must agree with probability_yes and with confidence (confidence = my_prob when outcome=YES; confidence = 1-my_prob when outcome=NO). Do not set my_prob equal to confidence when recommending NO. For proxy (non-sports) evidence, do not set my_prob more than ~0.05 above a calibrated estimate near evidence_quality; forecast/MapClick/aggregator pages cannot justify my_prob near 0.9+."
  edge_external: "Optional explicit YES-side edge: my_prob - implied_prob_external (both on the YES scale). Only valid when implied_prob_external is a true non-Kalshi external. For a NO recommendation this is typically negative when the NO side has positive edge."
  edge_source: "Source of edge calculation (computed, fallback, or none). Use computed when implied_prob_external is a real external (non-Kalshi) probability, including NWS PoP. edge_source=none means no usable quote, PoP, CLI, odds, or official result was found — a research gap, not a market judgment. NWS PoP and exchange/Tier-1 quotes are never none. Use fallback when a settlement-aligned URL is cited but no external implied probability exists; fallback requires the configured fallback edge threshold and cannot justify should_trade=true from edge_external alone."
  edge_mechanism: "Falsifiable reason the edge exists. Required whenever you lean YES or NO. One of: observed_vs_strike (live quote/CLI/METAR vs numeric threshold, including before official close), odds_dislocation (sportsbook/consensus vs Kalshi; sports only), settlement_already_known (official result/box/CLI already resolves the criterion), catalyst (dated primary-source event the market has not priced), none (no falsifiable mechanism — hunch, form, or unexplained directional view). Do not use none when a live quote, CLI, or PoP URL is in the reasoning. should_trade=true is forbidden when this is none. Name why this mechanism is not already in the Kalshi price."
  evidence_basis: "Evidence basis class (direct, proxy, or absence_only). Direct requires an observed/final settlement-relevant value from a cited source that explicitly matches the market's resolution criteria; for non-sports markets it also requires primary_source_url. Forecasts, projections, pregame previews, probable lineups, recent form, sportsbook odds, MapClick forecasts, and aggregator quotes remain proxy even on official domains. If primary_source_url points to a live quote, observation, or result page, do not use absence_only — use proxy or direct. absence_only means no usable source was found; abstain and describe what to research next."
  primary_source_url: "HTTPS URL of the single most decisive primary source used (must start with http:// or https://). REQUIRED when should_trade=true for any non-sports market; missing URL will cause rejection. Never put a prose label here (wrong: 'Binance SOL/USDT spot page'; right: 'https://www.binance.com/en/trade/SOL_USDT'). For live-price markets use exchange or Tier-1 wire-service quote pages, for weather use NWS/NOAA pages, and for speech/mention use transcripts or official statements."
  likelihood_ratio: "Optional likelihood ratio P(evidence|predicted_outcome) / P(evidence|alternative_outcome). Use null when no comparative evidence is available — never use 0 (undefined). Use 1.0 only when evidence is genuinely equally consistent with both outcomes after you considered alternatives. Prefer null over a reflexive 1.0 when you did not compute a real likelihood comparison. Values above 1.0 favor the predicted outcome; below 1.0 favor the alternative."
  evidence_quality: "Evidence quality score (0-1), set by validation layer. evidence_quality=0.0 means missing usable evidence and must be treated as a research gap. When evidence_basis=proxy, evidence_quality must not exceed 0.75 — having a primary_source_url does not override this ceiling — except for sports markets backed by external bookmaker/sportsbook odds, where settlement-predictive odds may reach 0.80. eq above the applicable proxy ceiling is reserved exclusively for evidence_basis=direct."
  abstain: "True when evidence quality is too weak to act on this cycle."
  raw_should_trade: "Raw model value before validation and enforcement."
  raw_outcome: "Raw model outcome before canonical normalization."
  raw_confidence: "Raw model confidence before normalization and capping."
  raw_bet_size_pct: "Raw model bet size before validation and policy gates."
  raw_reasoning: "Raw model reasoning before validator annotations."
  raw_evidence_quality: "Raw model evidence quality before validation recalibration."
  definitive_outcome_detected: "True when definitive settlement-aligned evidence is detected."
  evidence_quality_floor_applied: "Name of the evidence-quality floor rule applied during validation."
  source_match_class: "Validator-assigned class for the strongest evidence source: settlement_aligned, preview_or_proxy, verifiable_unmatched, missing_or_absence_only, or unverified."
  evidence_floor_suppressed_reason: "Validator-assigned reason an evidence-quality floor was not applied despite a verifiable-looking source signal."
  prompt_tokens: "Prompt token usage captured from provider response."
  completion_tokens: "Completion token usage captured from provider response."
  reasoning_tokens: "Reasoning token usage captured from provider response."
  cached_tokens: "Cached prompt token usage captured from provider response."
