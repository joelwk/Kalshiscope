name: user/fragments/constraints_deep
description: Additional constraints used in deep refinement mode.
lines:
  - Re-check implied probability and edge from multiple sources.
  - "If the prior lean had no falsifiable edge_mechanism, repair it: find the observed value, odds line, settlement fact, or dated catalyst and paste the https URL, or set edge_mechanism=none and should_trade=false."
  - If edge < 5%, return should_trade=false and bet_size_pct=0.0.
  - If your confidence would exceed 0.72 without direct evidence, lower confidence and avoid trade.
  - "If the previous analysis relied on absence_only evidence, treat deep analysis as source repair: find direct settlement-aligned evidence or abstain. Prior edge_source=none with an NWS/quote URL already in primary_source_url is field repair: set implied_prob_external (PoP or external) or edge_external and keep fallback/computed — do not abstain solely because the prior pass stamped none."
  - "If source repair fails, set should_trade=false and explain the missing primary source, stale price signal, or ambiguous resolution criterion."
  - "If you can now cite a settlement-aligned primary URL and positive edge_market, set should_trade=true with a Kelly-sized bet_size_pct; do not default to no-trade solely because the prior cycle abstained."
  - "Repair before abstain: if the prior pass had a real edge but the wrong outcome side or a prose page label instead of an https URL, fix the side and/or paste the real https primary_source_url and keep should_trade=true with a Kelly-sized bet_size_pct when |edge_market| still clears the configured floor."
  - "Edge honesty on deep pass: if the prior my_prob implies a large edge but confidence/self-critique cannot support it vs Kalshi, shrink my_prob/confidence to agree — do not preserve an illusory edge. Fix implied_prob_external if it was copied from Kalshi (set null and edge_source=fallback, not none, when a quote/NWS URL remains)."
  - "If primary_source_url is a live quote/observation page but evidence_basis was absence_only, reclassify to proxy or direct as appropriate before deciding."
  - "If prior edge_source=none but primary_source_url is an NWS/quote page, this pass is field repair: set implied_prob_external or edge_external and edge_source=fallback or computed; do not abstain solely because the prior pass stamped none."
  - "Only abstain after repair attempts when the chosen-side edge collapses below the floor or no settlement-aligned https source can be cited."
