name: user/category_hints/commodities
description: Commodity-market guidance.
content: >-
  Commodities guidance: settlement prices come from CME Group (WTI/Natural Gas/Gold/Silver/Copper) and ICE Futures (Brent). Required sources: CME settlement feed or EIA weekly report for energy; COMEX official close for metals. Live quote pages (WSJ, Bloomberg, Reuters) are acceptable for real-time threshold checks but must include the observed value and timestamp. Tradable commodity edge_mechanism is observed_vs_strike from a CME/ICE/EIA or Tier-1 quote versus the strike; a directional oil/metals hunch without that https quote is edge_mechanism=none.

  Prefer CME (cmegroup.com), ICE (theice.com), or COMEX quote/settlement pages that show the observed front-month price and timestamp for evidence_basis=direct. primary_source_url must be the exact https:// page (for example https://www.cmegroup.com/markets/energy/crude-oil/light-sweet-crude.html), never a prose label like "CME WTI quote Jul 28". Bare section landing pages without a quoted price (for example bloomberg.com/energy with no observed value) remain evidence_basis=proxy even when settlement-aligned — still set should_trade=true when buffer vs ATR supports a positive edge_market and primary_source_url is populated; do not abstain solely because the best citable URL is proxy.

  Before setting should_trade=true: (1) Fetch the current front-month contract price from a cited exchange or Tier-1 feed. (2) Compute buffer_to_threshold_pct = (price - threshold) / threshold. (3) Estimate remaining intraday volatility from the market's 30-day ATR or typical daily range — if buffer exceeds 1.5x typical move, edge is likely real; if buffer is within 0.5x typical move, the market is already pricing in the risk.

  Time context: CME energy markets settle at 2:30 PM ET; metals at 1:30 PM ET. Analysis within 2 hours of settlement with a large buffer (>2%) is high-certainty; analysis outside the session window requires a forward price or overnight-session quote.

  Do not use as primary_source_url: commodity aggregator sites (Trading Economics, Investing.com, Macrotrends, Kitco), analyst forecast articles, commentary, or social posts. These are proxy-tier sources regardless of URL presence. Cap my_prob/confidence at 0.70 on aggregator-only reads and never claim the contract "already resolved" from them. Acceptable primary_source_url sources: CME (cmegroup.com), COMEX settlement pages, ICE (theice.com), EIA (eia.gov), or Tier-1 wire-service live market data pages (WSJ, Bloomberg, Reuters) that show a live quote with timestamp.

  Edge honesty: buffer vs ATR can support a trade, but my_prob must stay consistent with confidence after self-critique — do not invent a large parallel edge that calibration will erase. Never copy Kalshi yes_price into implied_prob_external. A cited CME/ICE/WSJ/Bloomberg print versus a -T strike is edge_mechanism=observed_vs_strike; remaining-session vol is an uncertainty note, not a reason to set edge_mechanism=none.

  When a live exchange/Tier-1 quote supports edge_market >= 0.15 and you have the https:// page, set should_trade=true — do not park the case as no-trade because the cite was typed as a name. If primary_source_url cannot be populated for a commodity threshold market, set evidence_quality <= 0.60 and evidence_basis=proxy — do not award higher EQ without a URL.
