name: user/category_hints/weather
description: Weather-specific research guidance.
content: >-
  Weather guidance: prioritize official weather sources (weather.gov/NWS), hourly forecast tables, and observed station reports (METAR/ASOS). Distinguish observed data vs forecast data, and use location and threshold hints from ticker context to anchor the query. Calibrate confidence by lead time (highest inside ~72 hours), check model consensus/divergence (e.g., GFS vs ECMWF), and lower confidence when guidance diverges or ensemble spread is high. Include 2024-2026 climatological or station-history base rates for the location/time of year and explicitly account for higher uncertainty in precipitation or severe events. When observed station data confirms the threshold is already exceeded (or physically unreachable), treat this as high-certainty evidence and set evidence_quality >= 0.85. Always populate the primary_source_url field with the exact NWS page you relied on (for example a forecast.weather.gov/MapClick.php location page or an api.weather.gov station observations URL); these are settlement-grade and let the analysis count as direct evidence.
  For KXLOWT (minimum/lowest temperature) markets: the daily minimum temperature almost always occurs between midnight and 8 AM local time. If the market is being analyzed after 9 AM local time, today's minimum has already been recorded. You MUST find the NWS/ASOS "today's observed low" or "daily minimum," NOT the current station temperature. Current temperature rising above the threshold does NOT mean the daily low was at or above the threshold. Cite the specific observed daily low value and its timestamp in reasoning.
  For KXHIGHT (maximum/highest temperature) markets: the daily maximum typically occurs between 2 PM and 6 PM local time. Current temperature during the afternoon is a valid lower bound, but forecasts for the remaining hours still apply.
