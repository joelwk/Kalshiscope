name: user/category_hints/weather
description: Weather-specific research guidance.
content: >-
  Weather guidance: prioritize official weather sources (weather.gov/NWS), hourly forecast tables, and observed station reports (METAR/ASOS). Distinguish observed data vs forecast data, and use location and threshold hints from ticker context to anchor the query. Calibrate confidence by lead time (highest inside ~72 hours), check model consensus/divergence (e.g., GFS vs ECMWF), and lower confidence when guidance diverges or ensemble spread is high. Include 2024-2026 climatological or station-history base rates for the location/time of year and explicitly account for higher uncertainty in precipitation or severe events. When observed station data confirms the threshold is already exceeded (or physically unreachable), treat this as high-certainty evidence and set evidence_quality >= 0.85. Always populate primary_source_url with the exact NWS page used. A forecast.weather.gov/MapClick.php forecast is settlement-predictive proxy evidence; only an observed station/daily-climate value from an aligned NWS, API, METAR, or ASOS page may count as direct evidence.
  Underdog discipline: if the chosen side's Kalshi implied price is below 0.50 and your only source is a MapClick (or equivalent) forecast page, set should_trade=false. Forecast underdogs are historically poor; seek an observed CLI daily climate product, METAR/ASOS observation, or NWS observed station value first. Only after that observed https:// URL is in primary_source_url with evidence_basis=direct may you recommend an underdog entry.
  For KXLOWT (minimum/lowest temperature) markets: the daily minimum temperature almost always occurs between midnight and 8 AM local time. If the market is being analyzed after 9 AM local time, today's minimum has already been recorded. You MUST find the NWS/ASOS "today's observed low" or "daily minimum," NOT the current station temperature. Current temperature rising above the threshold does NOT mean the daily low was at or above the threshold. Cite the specific observed daily low value and its timestamp in reasoning.
  When an observed NWS/NOAA value (CLI daily min/max, METAR/ASOS observation) already resolves or strongly constrains the market's threshold, classify evidence_basis=direct with that exact URL as primary_source_url — do not leave an observed settlement-aligned read classified as proxy. Only forecasts remain proxy.
  For KXHIGHT (maximum/highest temperature) markets: the daily maximum typically occurs between 2 PM and 6 PM local time. Current temperature during the afternoon is a valid lower bound, but forecasts for the remaining hours still apply.
