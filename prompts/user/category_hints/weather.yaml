name: user/category_hints/weather
description: Weather-specific research guidance.
content: >-
  Weather guidance: prioritize official weather sources (weather.gov/NWS), hourly forecast tables, and observed station reports (METAR/ASOS). Distinguish observed data vs forecast data, and use location and threshold hints from ticker context to anchor the query. Calibrate confidence by lead time (highest inside ~72 hours), check model consensus/divergence (e.g., GFS vs ECMWF), and lower confidence when guidance diverges or ensemble spread is high. Include 2024-2026 climatological or station-history base rates for the location/time of year and explicitly account for higher uncertainty in precipitation or severe events. When observed station data confirms the threshold is already exceeded (or physically unreachable), treat this as high-certainty evidence and set evidence_quality >= 0.85. Always populate primary_source_url with the exact NWS page used. A forecast.weather.gov/MapClick.php forecast is settlement-predictive proxy evidence; only an observed station/daily-climate value from an aligned NWS, API, METAR, or ASOS page may count as direct evidence. Tradable weather edge_mechanism is observed_vs_strike or settlement_already_known from CLI/METAR; a forecast hunch without that observed URL is edge_mechanism=none.
  Near-dated weather (same-day / closing within ~24h): you MUST web_search for the NWS MapClick or CLI/METAR observation page before evidence_basis=absence_only. If tools return an NWS URL, paste it and prefer proxy/direct over abstaining. Never set evidence_basis=absence_only when primary_source_url is an NWS MapClick, CLI, or METAR page.
  MapClick edge honesty: do not invent my_prob far from the Kalshi price from a MapClick forecast alone (example failure mode: my_prob=0.79 vs market 0.53 that collapses after calibration). Keep my_prob/confidence within ~evidence_quality of a calibrated estimate; if the only source is MapClick, prefer should_trade=false unless |edge_market| after that honest shrink still clears the weather bar.
  Same-day KXHIGHT / max-temp markets before the local afternoon max window (typically before ~2 PM local): MapClick-only (or MapClick + yesterday's CLI) is not enough for should_trade=true. Require today's observed station/CLI constraint, or wait; yesterday's max does not settle today's high.
  Underdog discipline: if the chosen side's Kalshi implied price is below 0.50 and your only source is a MapClick (or equivalent) forecast page OR a tgftp/current-conditions page, set should_trade=false. Forecast and morning-dry underdogs are historically poor; seek an observed CLI daily climate product, METAR/ASOS observation, or NWS observed station value first. Only after that observed https:// URL is in primary_source_url with evidence_basis=direct may you recommend an underdog entry.
  PoP is implied_prob_external: if MapClick/NWS states a PoP or numeric forecast probability, set implied_prob_external to that 0-1 value so edge_source becomes computed. Never leave implied_prob_external null when you quoted a PoP.
  NWS URL is not a research gap: if primary_source_url is NWS/NOAA (MapClick, CLI product.php, METAR, or tgftp), set edge_source=computed when PoP/implied is set, otherwise fallback with edge_external populated. Never edge_source=none when an NWS URL is cited.
  Current page is not CLI: tgftp.nws.noaa.gov/weather/current/Kxxx.html is hourly nowcast, not the daily climate product. For KXLOWT / KXHIGHT / KXRAIN settlement, require CLI product.php?site=<WFO>&product=CLI&issuedby=<STN> or a METAR/CLI daily summary. Current temp/precip is a lower bound, not the daily min/max/rain total. Quote the observed daily value and timestamp.
  KXRAIN morning-dry is not NO: before local evening, a dry METAR does not settle NO. Only YES after measurable precip (CLI/METAR >= 0.01") is settlement_already_known. Morning-dry plus PoP is proxy; if the chosen side's Kalshi price is below 0.50, should_trade=false.
  WFO hygiene: site= and issuedby= must be the local office/station for the ticker city. Never mix offices (wrong: site=MOB with issuedby=PHL for Philadelphia).
  For KXLOWT (minimum/lowest temperature) markets: the daily minimum temperature almost always occurs between midnight and 8 AM local time. If the market is being analyzed after 9 AM local time, today's minimum has already been recorded. You MUST find the NWS/ASOS "today's observed low" or "daily minimum," NOT the current station temperature. Current temperature rising above the threshold does NOT mean the daily low was at or above the threshold. Cite the specific observed daily low value and its timestamp in reasoning.
  When an observed NWS/NOAA value (CLI daily min/max, METAR/ASOS observation) already resolves or strongly constrains the market's threshold, classify evidence_basis=direct with that exact URL as primary_source_url, set edge_mechanism=settlement_already_known, and set definitive_outcome_detected=true — do not leave an observed settlement-aligned read classified as proxy or edge_source=none. Only forecasts remain proxy.
  For KXHIGHT (maximum/highest temperature) markets: the daily maximum typically occurs between 2 PM and 6 PM local time. Current temperature during the afternoon is a valid lower bound, but forecasts for the remaining hours still apply.
