name: user/category_hints/crypto
description: Crypto-specific research guidance.
content: >-
  Crypto guidance: prioritize exchange/project primary sources, on-chain confirmations, spot price feeds, and time-sensitive catalysts over rumor accounts. Compare threshold probabilities against 2024-2026 realized volatility, recent intraday move distributions, and current buffer-to-threshold before setting confidence. Tradable crypto edge_mechanism is observed_vs_strike from an exchange quote plus buffer, or catalyst from a dated primary-source event; a directional hunch without the quote URL is edge_mechanism=none.

  Near-dated crypto (closing within ~24h, including 15-minute direction markets): you MUST web_search for a live exchange or Tier-1 index quote before evidence_basis=absence_only. If a quote page is found, paste the https:// URL and prefer proxy/computed over abstaining. If primary_source_url is a Coinbase/Binance/Kraken/Coindesk quote page, evidence_basis must be proxy or direct — never absence_only.

  15-minute / ultra-short direction markets: a live spot quote without a clear directional catalyst is not direct settlement evidence of the next interval's direction. Use evidence_basis=proxy (or absence_only only when no quote was found), keep my_prob near the 50/50 base rate unless you have a timed catalyst, and default should_trade=false when edge is noise. Do not set evidence_basis=direct merely because an exchange URL exists.

  Settlement sources: daily and range price markets resolve on a major-exchange spot or index close. Always populate the primary_source_url field with the exact https:// exchange quote page you relied on (for example https://www.binance.com/en/trade/SOL_USDT, https://www.coinbase.com/price/solana, https://www.kraken.com/prices/sol, or a coindesk.com index page) showing the observed price and timestamp; these are settlement-grade for threshold/spot markets and let the analysis count as direct evidence when the observed value addresses the strike. Never put a prose label like "Binance SOL/USDT spot page" in primary_source_url or as a substitute for the URL in key_sources — the field must be a real https:// link. Aggregators, chart sites, on-chain dashboards, and social posts (coingecko, tradingview, glassnode, tradingeconomics, etc.) are proxy-tier and cannot satisfy direct evidence regardless of URL presence; cap my_prob/confidence at 0.70 on aggregator-only reads and never claim the market already resolved from them.

  External odds hygiene: do not set implied_prob_external to the Kalshi yes_price. For threshold markets, compute edge_market from my_prob vs Kalshi; use edge_source=computed only when you also have a true external index/book probability.

  When you have a live exchange or Tier-1 quote, computed positive edge_market at least 0.15 versus Kalshi, and you can paste the https:// quote page into primary_source_url, set should_trade=true with a Kelly-sized bet_size_pct — do not default to no-trade solely because you typed the source as a name instead of a URL. If you cannot cite a settlement-grade exchange URL with the observed price and timestamp, set evidence_basis=proxy and evidence_quality <= 0.60 — do not award higher EQ or direct evidence without it.
