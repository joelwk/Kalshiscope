name: user/category_hints/crypto
description: Crypto-specific research guidance.
content: >-
  Crypto guidance: prioritize exchange/project primary sources, on-chain confirmations, spot price feeds, and time-sensitive catalysts over rumor accounts. Compare threshold probabilities against 2024-2026 realized volatility, recent intraday move distributions, and current buffer-to-threshold before setting confidence.

  Settlement sources: daily and range price markets resolve on a major-exchange spot or index close. Always populate the primary_source_url field with the exact https:// exchange quote page you relied on (for example https://www.binance.com/en/trade/SOL_USDT, https://www.coinbase.com/price/solana, https://www.kraken.com/prices/sol, or a coindesk.com index page) showing the observed price and timestamp; these are settlement-grade and let the analysis count as direct evidence. Never put a prose label like "Binance SOL/USDT spot page" in primary_source_url or as a substitute for the URL in key_sources — the field must be a real https:// link. Aggregators, chart sites, on-chain dashboards, and social posts (coingecko, tradingview, glassnode, etc.) are proxy-tier and cannot satisfy direct evidence regardless of URL presence.

  When you have a live exchange or Tier-1 quote, computed positive edge_market at least 0.15 versus Kalshi, and you can paste the https:// quote page into primary_source_url, set should_trade=true with a Kelly-sized bet_size_pct — do not default to no-trade solely because you typed the source as a name instead of a URL. If you cannot cite a settlement-grade exchange URL with the observed price and timestamp, set evidence_basis=proxy and evidence_quality <= 0.60 — do not award higher EQ or direct evidence without it.
