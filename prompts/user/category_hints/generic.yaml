name: user/category_hints/generic
description: Fallback guidance for unclassified markets.
content: >-
  Generic guidance: these markets cover macro, policy, indices, and unclassified events. Apply a higher evidence bar than domain-specific categories — require a primary source URL that directly addresses the settlement criterion before setting should_trade=true.

  Source hierarchy: (1) Official government or regulator release (Fed statements, BLS/BEA reports, FRED, official filings). (2) Tier-1 wire service with dateline (Reuters, AP, Bloomberg, WSJ live quote). (3) Exchange or platform settlement page. Do not use opinion commentary, aggregator sites, or secondary analysis as direct evidence.

  Aggregator discipline: Trading Economics, Investing.com, Macrotrends, and similar are proxy-tier only and must not be primary_source_url for KXINXU or hourly index markets — require a WSJ/Bloomberg/Reuters quote URL. Never write that the market "already resolves" from an aggregator print; cap my_prob and confidence at 0.70, keep evidence_basis=proxy, and leave definitive_outcome_detected=false. Prefer FRED / Treasury / WSJ / Reuters quote pages for rates and indexes.

  Edge honesty: do not set my_prob near 0.95+ on a thin aggregator or stale prior close while Kalshi prices a coin-flip — that edge will be treated as hallucinated. Keep my_prob aligned with confidence after self-critique.

  External odds hygiene: never copy Kalshi yes_price into implied_prob_external. Without a true external feed, leave implied_prob_external null and use edge_source=fallback (not none) when primary_source_url is populated.

  An intraday live quote versus a numeric strike is edge_mechanism=observed_vs_strike even before the official close. Remaining-session volatility is an uncertainty note, not a reason to set edge_mechanism=none.

  Before setting confidence above 0.65: cite the specific sentence or data point from the primary source that addresses the settlement criterion. If you cannot identify one sentence, evidence_basis is proxy or absence_only — lower confidence accordingly.

  Use a 2024-2026 comparable-event base rate from resolved Kalshi markets or public polling before adjusting for fresh evidence. Name the base rate explicitly in reasoning. If no base rate is available, cap confidence at 0.60 and require edge_market >= 0.12 before recommending should_trade=true.

  Prefer Kelly-sized small bets only when primary_source_url is populated with a settlement-aligned https:// URL (never a prose label like "WSJ 10Y quote page"); otherwise keep should_trade=false and treat the case as source repair. When a settlement-aligned live quote supports edge_market >= 0.18 and primary_source_url is a real https:// link, set should_trade=true rather than defaulting to no-trade.
